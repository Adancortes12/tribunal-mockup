<div class="page">

    <div class="page-heading">

        <div>
            <span class="eyebrow">
                Gestión jurídica
            </span>

            <h1>
                Expedientes
            </h1>

            <p>
                Consulta y administra los expedientes registrados.
            </p>
        </div>

        <button
            class="primary-btn"
            data-action="new-expediente"
        >
            + Nuevo expediente
        </button>

    </div>


    <div class="toolbar">

        <div class="toolbar-search">

            <input
                type="text"
                id="expedientesSearch"
                placeholder="Buscar expediente, actor o demandado..."
            >

        </div>

    </div>


    <div class="table-container">

        <table>

            <thead>

                <tr>

                    <th>
                        Expediente
                    </th>

                    <th>
                        Fecha recepción
                    </th>

                    <th>
                        Actor
                    </th>

                    <th>
                        Demandado
                    </th>

                    <th>
                        Clasificación
                    </th>

                    <th>
                        Estado
                    </th>

                    <th>
                        Ubicación
                    </th>

                    <th>
                        Acción
                    </th>

                </tr>

            </thead>


            <tbody id="expedientesTable">

            </tbody>

        </table>

    </div>

</div>
