<div class="page">

    <div class="page-heading">

        <div>

            <span class="eyebrow">
                Registro jurídico
            </span>

            <h1>
                Amparos
            </h1>

            <p>
                Consulta y registra los amparos relacionados con los expedientes.
            </p>

        </div>


        <button
            class="primary-btn"
            data-action="new-amparo"
        >
            + Nuevo amparo
        </button>

    </div>


    <div class="toolbar">

        <div class="toolbar-search">

            <input
                type="text"
                id="amparosSearch"
                placeholder="Buscar por expediente, promovente u oficio..."
            >

        </div>

    </div>


    <div class="table-container">

        <table>

            <thead>

                <tr>

                    <th>
                        Día
                    </th>

                    <th>
                        Hora
                    </th>

                    <th>
                        Expediente
                    </th>

                    <th>
                        Promueve
                    </th>

                    <th>
                        No. juzgado
                    </th>

                    <th>
                        No. oficio
                    </th>

                    <th>
                        Acción
                    </th>

                </tr>

            </thead>


            <tbody id="amparosTable">

            </tbody>

        </table>

    </div>

</div>
